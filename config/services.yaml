# config/services.yaml
parameters:
    stripe_secret_key: "%env(STRIPE_SECRET_KEY)%"
    stripe_public_key: "%env(STRIPE_PUBLIC_KEY)%"
    stripe_client_id: "%env(STRIPE_CONNECT_CLIENT_ID)%"
    stripe_webhook_secret: "%env(STRIPE_WEBHOOK_SECRET)%"
    from_email: "%env(FROM_EMAIL)%"
    from_name: "%env(FROM_NAME)%"
    base_url: "%env(BASE_URL)%"
    uploads_directory: '%kernel.project_dir%/public/uploads'
    documents_directory: '%kernel.project_dir%/public/uploads/documents'
    messages_attachments_directory: '%kernel.project_dir%/public/uploads/messages'
    upload_dir: '%kernel.project_dir%/public/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\StripeService:
        arguments:
            $secretKey: '%stripe_secret_key%'
            $publicKey: '%stripe_public_key%'
            $clientId: '%stripe_client_id%'
            $webhookSecret: '%stripe_webhook_secret%'    # ADD THIS
            $router: '@router'
            $entityManager: '@doctrine.orm.entity_manager'
            $params: '@parameter_bag'                     # ADD THIS

    # Remove or comment out these duplicate Stripe client definitions
    # stripe.client:
    #     class: 'Stripe\StripeClient'
    #     arguments:
    #         - '%env(STRIPE_SECRET_KEY)%'
    # 
    # Stripe\StripeClient: '@stripe.client'

    App\Security\OAuthUserProvider:
        arguments:
            $em: '@doctrine.orm.entity_manager'
        tags:
            - { name: hwi_oauth.user.provider }

    App\EventListener\WorkflowLoggerListener:
        tags:
            - { name: 'kernel.event_listener', event: 'workflow.entered', method: 'onEntered' }

    Twig\Extension\StringLoaderExtension:
        tags: [ twig.extension ]
